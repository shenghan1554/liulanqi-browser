name: Bug 报告
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索[已有 Issue](https://github.com/shenghan1554/liulanqi-browser/issues)，避免重复。
        涉及安全漏洞请勿公开提交，见 [SECURITY.md](https://github.com/shenghan1554/liulanqi-browser/blob/main/SECURITY.md)。
  - type: input
    id: version
    attributes:
      label: 浏览器版本
      description: 设置 → 关于 里可以看到，或看 `package.json`
      placeholder: "1.0.5"
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: 使用哪种版本
      options:
        - 安装版（安装程序装的）
        - 便携版（双击 浏览器.exe）
        - 从源码运行
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 系统与硬件
      description: Windows 版本、是否远程桌面/虚拟机、显卡型号、缩放比例
      placeholder: "Windows 11 23H2 / 无独显 / 125% 缩放"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 出现 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: |
        便携版日志在 `data/logs/`；也可在设置里看「硬件加速」一栏的状态。
        **请先删掉日志里的个人网址与路径。**
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已在最新版本上复现
          required: true
        - label: 我已搜索过已有 Issue
          required: true