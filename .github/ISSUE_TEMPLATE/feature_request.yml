name: 功能建议
description: 提出一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前请先想清楚**使用场景**——这个功能解决什么问题，比功能本身更重要。
        也欢迎先看看 [CONTRIBUTING.md](https://github.com/shenghan1554/liulanqi-browser/blob/main/CONTRIBUTING.md)。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到什么问题
      description: 描述场景与痛点，不要只写「加一个 XXX 功能」
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的解决方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
  - type: dropdown
    id: scope
    attributes:
      label: 大致属于哪一块
      options:
        - 标签页 / 窗口
        - 地址栏 / 搜索
        - 书签 / 历史 / 下载
        - 界面 / 主题 / 壁纸
        - 隐私 / 无痕
        - 视频 / DRM
        - 性能
        - 构建 / 打包
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过已有 Issue 与讨论
          required: true
        - label: 这个功能不涉及 DRM 绕过或闭源组件分发
          required: true